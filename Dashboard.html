<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace Dashboard</title>
<style>
:root{
  --bg:#f3eee4;--panel:#fbf8f1;--side:#f3eee4;--ink:#201b15;--muted:#7f745f;--line:#d9d1c2;
  --accent:#a8432d;--accent-ink:#fffaf2;--soft:#ebe2cf;--warn:#a8432d;--warnsoft:#f3ddd3;--ok:#4d6b3a;--oksoft:#e2e9d4;
  --chip:#ebe2cf;--code:#ece4d3;--shadow:0 1px 0 rgba(0,0,0,.02);
  --serif:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
  --sans:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1612;--panel:#231e18;--side:#1a1612;--ink:#efe7d8;--muted:#a39886;--line:#38312a;
    --accent:#e4806a;--accent-ink:#1a1612;--soft:#2c251d;--warn:#e4806a;--warnsoft:#3a2620;--ok:#9dbd86;--oksoft:#26301f;
    --chip:#2c251d;--code:#241f19;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1612;--panel:#231e18;--side:#1a1612;--ink:#efe7d8;--muted:#a39886;--line:#38312a;
  --accent:#e4806a;--accent-ink:#1a1612;--soft:#2c251d;--warn:#e4806a;--warnsoft:#3a2620;--ok:#9dbd86;--oksoft:#26301f;
  --chip:#2c251d;--code:#241f19;--shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.5 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:30px 22px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font:italic 22px var(--serif);margin:0 0 26px;cursor:pointer}
.logo{display:none}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 0;color:var(--ink);margin-bottom:18px;font:inherit;outline:none}
.search:focus{border-bottom-color:var(--ink)}
.nav button{display:flex;width:100%;gap:9px;align-items:center;padding:5px 0;border:0;background:none;text-align:left;color:var(--muted)}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--accent);font-weight:650}
.sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px;font-weight:650}
.tree{font-size:14px}
.tree details{margin:0}
.tree summary{list-style:none;padding:4px 0;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.tree summary::-webkit-details-marker{display:none}
.tree summary:hover,.tree .file:hover{color:var(--ink)}
.tree .file{display:block;width:100%;text-align:left;border:0;background:none;padding:3px 0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.tree .file.on{color:var(--accent);font-weight:600}
.tree .kids{padding-left:14px;border-left:1px solid var(--line);margin-left:3px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.badge{font-size:12px;color:var(--muted);margin-left:auto}
main{overflow:auto;padding:34px 64px 80px}
.wrapm{max-width:1120px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.date{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font:400 38px/1.12 var(--serif);margin:4px 0 6px;letter-spacing:-.01em}
h1 i{color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:4px;padding:6px 12px;font-weight:550;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:2px 9px;font-size:12.5px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.kbd{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);margin-left:6px}
.seg{display:inline-flex;gap:2px}
.seg button{border:0;background:none;padding:4px 8px;font-size:12.5px;color:var(--muted);border-bottom:1px solid transparent}
.seg button.on{color:var(--ink);border-bottom-color:var(--accent)}
.stats{display:none}
.card{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:16px 0 22px;box-shadow:none}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px 64px}
h2{font:400 24px/1.2 var(--serif);margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
h2 span{color:var(--muted);font:400 13px var(--sans)}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .body{flex:1;min-width:0}
.tag{font-size:12px;padding:0;background:none;color:var(--muted);white-space:nowrap}
.tag.w{color:var(--warn);font-weight:650}
.tag.g{color:var(--ok);font-weight:650}
.t{font-weight:560}
.m{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:6px 0;font-style:italic;font-family:var(--serif)}
.weekcard{margin-bottom:14px}
.focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 28px;margin-bottom:14px}
.focus .f{border-top:1px solid var(--line);padding:10px 0}
.focus .f .t{font:400 19px/1.3 var(--serif)}
.focus .f .m{margin-top:3px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0}
.day{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:8px;min-height:96px}
.day:first-child{border-left:0}
.day.today{background:var(--soft)}
.day .dh{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:650}
.day.today .dh{color:var(--accent)}
.blk{font-size:12.5px;padding:3px 0;margin-bottom:4px;color:var(--ink);border-left:2px solid var(--accent);padding-left:7px;overflow-wrap:anywhere}
.blk .tm{display:block;color:var(--muted);font-size:11.5px}
.blk.due{border-left-color:var(--warn)}
.blk.fixed{border-left-color:var(--muted);color:var(--muted)}
button.blk{display:block;width:100%;text-align:left;font:inherit;font-size:12.5px;border:0;border-left:2px solid var(--accent);background:none;cursor:grab}
button.blk.due{border-left-color:var(--warn)}
button.blk.sel{outline:2px solid var(--accent)}
.day.over{background:var(--soft)}
.movemenu{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.movemenu .btn{padding:2px 7px;font-size:11px}
.goal{padding:10px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.goal .t{font:400 19px var(--serif);display:flex;gap:8px;justify-content:space-between;align-items:baseline}
.goal .m{margin-top:3px}
.ws{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 24px}
.wsc{border:0;border-top:1px solid var(--line);padding:10px 0;background:none;text-align:left}
.wsc:hover .nm{color:var(--accent)}
.wsc .nm{font:400 18px var(--serif);display:flex;align-items:center;gap:7px}
.doc{max-width:820px}
.doc .crumb{color:var(--muted);font-size:12.5px;margin-bottom:6px;word-break:break-all}
.md h1{font-size:34px;margin:.2em 0 .5em}.md h2{font-size:24px;margin:1.4em 0 .5em;display:block}.md h3{font:400 18px var(--serif);margin:1.2em 0 .4em}
.md p{margin:.6em 0}.md ul,.md ol{padding-left:22px}.md li{margin:.25em 0}
.md code{background:var(--code);padding:1px 5px;border-radius:3px;font-size:.92em}
.md pre{background:var(--code);padding:12px;border-radius:4px;overflow:auto}.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:13.5px}
.md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.md th{background:var(--chip)}
.md blockquote{margin:.8em 0;padding:4px 14px;border-left:3px solid var(--line);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
textarea.editor{width:100%;min-height:65vh;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:14px;resize:vertical}
.hit{padding:10px 0;border-top:1px solid var(--line)}.hit:first-child{border-top:0}
.hit mark{background:var(--soft);color:var(--ink);padding:0 2px}
.welcome{max-width:600px;margin:9vh auto;text-align:left}
.welcome h1{font-size:40px}
.welcome ol{padding-left:20px}.welcome li{margin:6px 0}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 14px;font-size:14px;margin:12px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:4px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;display:flex;gap:14px;align-items:center;z-index:30}
.toast.show{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:var(--bg);text-decoration:underline;padding:0;font-weight:650}
dialog{border:1px solid var(--ink);border-radius:4px;background:var(--panel);color:var(--ink);padding:24px;max-width:480px;width:calc(100% - 32px);box-shadow:8px 8px 0 rgba(0,0,0,.12)}
dialog::backdrop{background:rgba(20,16,10,.45)}
dialog h2{font-size:26px;margin-bottom:6px}
dialog label{display:block;margin:12px 0 4px;color:var(--muted);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.names{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.names button{border:1px solid var(--line);background:none;border-radius:4px;padding:5px 12px}
.names button.on{border-color:var(--accent);color:var(--accent)}
.field{width:100%;padding:8px 2px;border:0;border-bottom:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit;outline:none;border-radius:0}
select.field{padding:8px 0}
textarea.field{border:1px solid var(--line);padding:8px;min-height:84px;resize:vertical}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.err{color:var(--warn);font-size:13px;margin-top:10px;min-height:1px}
.menu{display:none}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:start}
.col{background:none;border-top:2px solid var(--ink);padding:10px 0;min-height:150px}
.col.over{background:var(--soft)}
.col h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;font-weight:650}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:9px 11px;margin-bottom:8px;cursor:grab}
.tcard.dragging{opacity:.5}
.tcard .tt{font-weight:560;overflow-wrap:anywhere}
.tcard .tools{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap;align-items:center}
.tcard input[type=date]{font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.chips select,.chips .field{width:auto}
.dl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.dl:first-of-type{border-top:0}

/* home */
.capture{border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:18px;padding:4px 0 8px;margin-bottom:34px}
.capture input{flex:1;border:0;background:transparent;font:italic 24px var(--serif);color:var(--ink);outline:none;min-width:0}
.capture input::placeholder{color:var(--muted);opacity:.7}
.capture .qa{display:flex;gap:14px;font-size:13px;flex-wrap:wrap}
.capture .qa button{border:0;background:none;color:var(--muted);border-bottom:1px solid var(--line);padding:0 0 1px}
.capture .qa button:hover{color:var(--accent);border-bottom-color:var(--accent)}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0 64px}
.trow{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line)}
.trow .circle{width:17px;height:17px;border:1.5px solid var(--ink);border-radius:50%;flex:none;transform:translateY(3px);background:none;padding:0}
.trow .circle:hover{background:var(--accent);border-color:var(--accent)}
.trow .circle.s{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.trow .x{flex:1;font-size:17px;min-width:0;overflow-wrap:anywhere}
.trow .w{font-size:12.5px;color:var(--muted);white-space:nowrap}
.trow .d{font-size:12.5px;color:var(--accent);font-weight:650;white-space:nowrap}
.trow .hov{display:none;gap:8px}
.trow:hover .hov{display:flex}
.trow .hov button{border:0;background:none;color:var(--muted);font-size:12.5px;padding:0;border-bottom:1px solid var(--line)}
.trow .hov button:hover{color:var(--accent)}
.fnum{display:flex;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.fnum .n{font:400 36px/1 var(--serif);color:var(--accent);width:30px}
.fnum .tt{font:400 19px/1.3 var(--serif)}
.cap{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font:400 16px var(--serif)}
.cap .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.cap .acts{display:flex;gap:10px;font:12.5px var(--sans)}
.cap .acts button{border:0;background:none;color:var(--accent);padding:0;border-bottom:1px solid transparent}
.cap .acts button:hover{border-bottom-color:var(--accent)}
.cap .acts .dim{color:var(--muted)}
.bar{height:5px;background:var(--line);margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--accent)}
.more{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 64px;margin-top:10px}

/* palette */
#pal{position:fixed;inset:0;background:rgba(20,16,10,.5);display:none;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:40}
#pal.open{display:flex}
.pbox{width:min(640px,calc(100% - 32px));background:var(--panel);border:1px solid var(--ink);border-radius:4px;box-shadow:10px 10px 0 rgba(0,0,0,.14);overflow:hidden}
.pbox input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:italic 22px var(--serif);padding:16px 20px;outline:none}
.plist{max-height:50vh;overflow:auto;padding:6px 0}
.ph{padding:10px 20px 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:650}
.pit{display:flex;align-items:baseline;gap:12px;padding:8px 20px;cursor:pointer}
.pit.on{background:var(--soft)}
.pit .n{font-weight:560}
.pit .d{color:var(--muted);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pit .k{font:12px ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.pft{border-top:1px solid var(--line);padding:8px 20px;color:var(--muted);font-size:12.5px;display:flex;gap:18px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{display:none;position:fixed;inset:0 20% 0 0;z-index:5;box-shadow:0 0 40px rgba(0,0,0,.3)}
  aside.open{display:block}
  .menu{display:inline-block}
  main{padding:18px 18px 70px}
  .grid,.cols,.more{grid-template-columns:1fr}
  .days{grid-template-columns:1fr}
  .day{min-height:0;border-left:0}
  .board{grid-template-columns:1fr}
  h1{font-size:30px}
  .capture{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><div class="logo" id="logo">W</div><span id="brandName">My Workspace</span></div>
    <button class="btn" data-pal="1" style="width:100%;text-align:left;margin-bottom:14px;display:flex;justify-content:space-between">Quick actions <span class="kbd" id="kbdHint">Ctrl K</span></button>
    <input class="search" id="search" type="search" placeholder="Search all files" autocomplete="off">
    <div class="nav">
      <button data-view="dashboard" class="on">Today</button>
      <button data-view="board">Board</button>
      <button data-view="inbox">Inbox<span class="badge" id="inboxBadge" hidden></span></button>
      <button data-view="projects">Projects</button>
      <button data-view="goals">Goals</button>
      <button data-view="files">All files</button>
      <button data-open="MEMORY.md">Memory</button>
      <button data-view="notion">Notion</button>
    </div>
    <div class="sec">Areas</div>
    <div class="tree" id="wsTree"></div>
    <div class="sec">Workspace</div>
    <div class="tree" id="sysTree"></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="nameDialog">
  <h2>Name your dashboard</h2>
  <div class="sub">Pick one of these, or write your own. You can change it later.</div>
  <div class="names" id="nameOptions"></div>
  <input class="field" id="nameInput" placeholder="Or type a name" maxlength="40">
  <div class="sub" id="nameWhere" style="margin-top:10px;font-size:12.5px"></div>
  <div class="actions" style="justify-content:flex-end;margin-top:16px">
    <button class="btn" id="nameSkip">Not now</button>
    <button class="btn p" id="nameSave">Save name</button>
  </div>
</dialog>
<dialog id="formDialog">
  <h2 id="formTitle"></h2>
  <div class="sub" id="formIntro"></div>
  <div id="formFields"></div>
  <div class="err" id="formErr"></div>
  <div class="actions" style="justify-content:flex-end;margin-top:16px">
    <button class="btn" id="formCancel" type="button">Cancel</button>
    <button class="btn p" id="formSave" type="button">Save</button>
  </div>
</dialog>
<div id="pal"><div class="pbox">
  <input id="palInput" placeholder="Do something, or go somewhere" autocomplete="off" spellcheck="false">
  <div class="plist" id="palList"></div>
  <div class="pft"><span>&uarr;&darr; choose</span><span>&crarr; run</span><span>esc close</span><span style="margin-left:auto" id="palNote"></span></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";

/* ---------- small helpers ---------- */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function toast(msg,act){
  var t=$("toast"); t.innerHTML=""; var sp=document.createElement("span"); sp.textContent=msg; t.appendChild(sp);
  if(act){ var b=document.createElement("button"); b.textContent=act.label; b.onclick=function(){ t.classList.remove("show"); act.fn(); }; t.appendChild(b); }
  t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("show"); },act?9000:2600);
}
var TZ=null; /* the user's time zone from Core Memory, when one is recorded */
function tzOpt(o){ o=o||{}; if(TZ) o.timeZone=TZ; return o; }
function todayISO(){ try{ return new Intl.DateTimeFormat("en-CA",tzOpt({year:"numeric",month:"2-digit",day:"2-digit"})).format(new Date()); }catch(e){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); } }
function daysSince(iso){ if(!iso) return null; var t=Date.parse(iso+"T00:00:00"); if(isNaN(t)) return null; return Math.max(0,Math.floor((Date.parse(todayISO()+"T00:00:00")-t)/86400000)); }
function ago(ms){ if(!ms) return ""; var d=Math.max(0,Math.floor((Date.now()-ms)/86400000)); if(d<=0) return "today"; if(d===1) return "yesterday"; if(d<7) return d+" days ago"; if(d<14) return "last week"; if(d<60) return Math.floor(d/7)+" weeks ago"; return Math.floor(d/30)+" months ago"; }
var COLORS=["#3b5bdb","#2f855a","#c2410c","#9333ea","#0891b2","#a16207","#be185d","#4d7c0f","#0f766e","#7c3aed"];
var store={ get:function(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set:function(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };

/* ---------- theme: light, dark or system ---------- */
function applyTheme(mode){
  if(mode==="light"||mode==="dark") document.documentElement.setAttribute("data-theme",mode);
  else document.documentElement.removeAttribute("data-theme");
  store.set("cw-theme",mode);

/* ---------- state ---------- */
var S = { dir:null, files:{}, canWrite:false, view:"welcome", current:null, editing:false, folderName:"", loadedAt:0 };
var SKIP_DIRS = { ".git":1, "node_modules":1, ".backups":1, ".obsidian":1, ".claude":1, ".github":1, ".trash":1 };

/* ---------- loading the folder ---------- */
async function walk(dirHandle, prefix, out){
  for await (var entry of dirHandle.values()){
    var path = prefix ? prefix+"/"+entry.name : entry.name;
    if(entry.kind==="directory"){
      if(SKIP_DIRS[entry.name] || entry.name.charAt(0)===".") continue;
      await walk(entry, path, out);
    } else if(/\.md$/i.test(entry.name)){
      var f = await entry.getFile();
      out[path] = { text: await f.text(), mtime: f.lastModified, handle: entry };
    }
  }
}
async function openWithPicker(){
  if(!window.showDirectoryPicker){ $("folderInput").click(); return; }
  try{
    var dir = await window.showDirectoryPicker({ id:"cowork-workspace", mode:"readwrite" });
    await loadDir(dir);
    saveHandle(dir);
  }catch(e){ if(e && e.name!=="AbortError") toast("Could not open that folder: "+e.message); }
}
async function loadDir(dir){
  var out={}; await walk(dir,"",out);
  S.dir=dir; S.files=out; S.folderName=dir.name; S.loadedAt=Date.now();
  S.canWrite = true;
  try{ if(dir.queryPermission && (await dir.queryPermission({mode:"readwrite"}))!=="granted") S.canWrite=false; }catch(e){}
  afterLoad();
}
function loadFromInput(fileList){
  var out={}, pending=[];
  Array.prototype.forEach.call(fileList,function(f){
    var rel=(f.webkitRelativePath||f.name).split("/");
    var top=rel.shift();
    S.folderName=top;
    var path=rel.join("/");
    if(!/\.md$/i.test(path)) return;
    if(rel.some(function(p){ return SKIP_DIRS[p] || p.charAt(0)==="."; })) return;
    pending.push(f.text().then(function(t){ out[path]={ text:t, mtime:f.lastModified, handle:null }; }));
  });
  Promise.all(pending).then(function(){ S.dir=null; S.files=out; S.canWrite=false; S.loadedAt=Date.now(); afterLoad(); });
}

/* ---------- writing files ---------- */
async function writeFile(path, text, expectMtime){
  var rec=S.files[path];
  if(!S.canWrite || !rec || !rec.handle) throw new Error("This browser opened a read-only copy.");
  var cur=await rec.handle.getFile();
  if(expectMtime && cur.lastModified!==expectMtime){
    var disk=await cur.text();
    if(disk!==rec.text) throw new Error("CHANGED");
  }
  var before=rec.text;
  var w=await rec.handle.createWritable(); await w.write(text); await w.close();
  var f=await rec.handle.getFile(); rec.text=text; rec.mtime=f.lastModified;
  if(S.txn) S.txn.push({path:path,before:before,after:text});
}

function sections(text){

    if(cur) out[cur].lines.push({text:line,index:i});

}
function entriesOf(sec){

    var raw=l.text.replace(/^\s*-\s+/,"");
    var dm=raw.match(/^\[(\d{4}-\d{2}-\d{2})\]\s*/); var date=dm?dm[1]:null; if(dm) raw=raw.slice(dm[0].length);
    var plain=raw.replace(/\*\*|__|`/g,"").replace(/\[(\d{4}-\d{2}-\d{2})\]/g,"$1").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1");
    var title=plain, detail="";
    var q=plain.match(/^"([^"]+)"\s*[-:]?\s*(.*)$/);
    if(q){ title=q[1]; detail=q[2]; }
    else { var cut=plain.search(/[.;:]\s|\s-\s/); if(cut>8 && cut<110){ title=plain.slice(0,cut); detail=plain.slice(cut+1).replace(/^[\s-]+/,""); } }
    return { line:l.index, raw:l.text, date:date, title:title.trim(), detail:detail.trim() };
  });
}
function tableRows(text, heading){

}

/* ---------- markdown to HTML (small, safe subset) ---------- */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(m,t,u){
    if(/^https?:\/\//i.test(u)) return '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>';
    return '<a href="#" data-link="'+u+'">'+t+'</a>';
  });
  return s;
}
function md(text){
  var lines=text.replace(/\r/g,"").split("\n"), out=[], i=0;
  if(lines[0]==="---"){ var e=lines.indexOf("---",1); if(e>0) i=e+1; }
  var list=null;
  function close(){ if(list){ out.push("</"+list+">"); list=null; } }
  while(i<lines.length){
    var l=lines[i];
    if(/^```/.test(l)){ close(); var buf=[]; i++; while(i<lines.length && !/^```/.test(lines[i])){ buf.push(esc(lines[i])); i++; } out.push("<pre><code>"+buf.join("\n")+"</code></pre>"); i++; continue; }
    if(/^\|/.test(l) && i+1<lines.length && /^\|\s*:?-/.test(lines[i+1])){
      close(); var head=l.split("|").slice(1,-1); var html="<table><thead><tr>"+head.map(function(c){return "<th>"+inline(c.trim())+"</th>";}).join("")+"</tr></thead><tbody>"; i+=2;
      while(i<lines.length && /^\|/.test(lines[i])){ html+="<tr>"+lines[i].split("|").slice(1,-1).map(function(c){return "<td>"+inline(c.trim())+"</td>";}).join("")+"</tr>"; i++; }
      out.push(html+"</tbody></table>"); continue;
    }
    var h=l.match(/^(#{1,4})\s+(.*)$/); if(h){ close(); out.push("<h"+h[1].length+">"+inline(h[2])+"</h"+h[1].length+">"); i++; continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){ close(); out.push("<hr>"); i++; continue; }
    if(/^>\s?/.test(l)){ close(); out.push("<blockquote>"+inline(l.replace(/^>\s?/,""))+"</blockquote>"); i++; continue; }
    var ul=l.match(/^\s*[-*]\s+(.*)$/), ol=l.match(/^\s*\d+\.\s+(.*)$/);
    if(ul||ol){ var kind=ul?"ul":"ol"; if(list!==kind){ close(); out.push("<"+kind+">"); list=kind; } out.push("<li>"+inline((ul||ol)[1])+"</li>"); i++; continue; }
    if(!l.trim()){ close(); i++; continue; }
    close(); var para=[l]; i++;
    while(i<lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\||>|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])){ para.push(lines[i]); i++; }
    out.push("<p>"+inline(para.join(" "))+"</p>");
  }
  close();
  return out.join("\n");
}

function goalsCard(M){
  var t=M.today;
  return '<div class="card"><h2>Goals <span>this quarter</span></h2>'+(M.goals.length?M.goals.map(function(g){
    var open=g.ws?M.tasks.filter(function(x){ return x.ws===g.ws; }).length:null;
    var q=''; if(g.quarter){ var past=g.qby && g.qby<t; var left=g.qby&&!past?Math.round((Date.parse(g.qby)-Date.parse(t))/86400000):null;
      q='<div class="m">This quarter: '+esc(g.quarter)+(g.qby?(past?' <span class="tag w">date passed: time for a quarterly review</span>':' &middot; '+left+' days left'):'')+'</div>'; }
    else q='<div class="m">No milestone for this quarter yet. Say "set my goals" to add one.</div>';
    var tk=g.ws?(open?'<div class="m">'+open+' open task'+(open>1?'s':'')+' in '+esc(g.ws)+'</div>':'<div class="m"><span class="tag w">No open task in '+esc(g.ws)+'</span></div>'):'';
    return '<div class="goal"><div class="t"><span>'+esc(g.text)+'</span>'+(g.by?'<span class="tag">by '+esc(g.by)+'</span>':'')+'</div>'+q+(g.plan?'<div class="m">'+esc(g.plan)+'</div>':'')+tk+'</div>';
  }).join(""):'<div class="empty">No goals yet. Say "set my goals" and each one gets a milestone for this quarter and a first step.</div>')+'</div>';
}
async function moveItem(ref,day){
  S.moving=null;
  var parts=ref.split("|"), kind=parts[0], idx=parseInt(parts[parts.length-1],10), path=parts.slice(1,-1).join("|"), rec=S.files[path];
  if(!rec){ render(); return; }
  var lines=rec.text.split("\n"), line=lines[idx]||"", nl;
  if(kind==="b"){ if(!/^\s*-\s*Block:\s*\d{4}-\d{2}-\d{2}/i.test(line)){ toast("That block moved. Refresh and try again."); return; } nl=line.replace(/(Block:\s*)\d{4}-\d{2}-\d{2}/i,"$1"+day); }
  else { if(!/^\s*-\s*\[[ \/>]\].*\(due\s+\d{4}-\d{2}-\d{2}\)/i.test(line)){ toast("That task moved. Refresh and try again."); return; } nl=line.replace(/(\(due\s+)\d{4}-\d{2}-\d{2}/i,"$1"+day); }
  if(nl===line){ render(); return; }
  lines[idx]=nl;
  await run("Moved to "+dayLabel(day)+"."+(kind==="b"?" Your calendar is unchanged.":""), async function(){ await writeFile(path, lines.join("\n"), rec.mtime); });
}

function stat(n,l){ return '<div class="card stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
function health(M){
  var out=[], row=function(ok,t){ out.push('<div class="row"><span class="tag '+(ok?"g":"w")+'">'+(ok?"OK":"Check")+'</span><div class="body t">'+t+'</div></div>'); };
  var names=Object.keys(M.ws), routedSet={}; M.routed.forEach(function(r){ routedSet[r.toLowerCase()]=1; });
  var missing=names.filter(function(n){ return !routedSet[n.toLowerCase()]; });
  var ghost=M.routed.filter(function(r){ return r && !/^example workstation$/i.test(r) && !M.ws[r] && !Object.keys(M.ws).some(function(n){return n.toLowerCase()===r.toLowerCase();}); });
  row(!missing.length, missing.length? esc(missing.join(", "))+" "+(missing.length>1?"have":"has")+" no Routing Map row" : "Every workstation has a Routing Map row");
  if(ghost.length) row(false, "Routing Map points to a missing folder: "+esc(ghost.join(", ")));
  row(!M.temp.length, M.temp.length? M.temp.length+(M.temp.length>1?" files in 98_Temp need a home":" file in 98_Temp needs a home") : "98_Temp is empty");
  row(M.memLines<=150, M.memLines<=150? "MEMORY.md is within its 150-line limit" : "MEMORY.md is over its 150-line limit");
  var over=names.filter(function(n){ return M.ws[n].memLines>200; });
  if(over.length) row(false, esc(over.join(", "))+" MEMORY.md over 200 lines");
  var d=daysSince(M.weekly);
  if(d===null && M.weeklySetup){ var ds=daysSince(M.weeklySetup); row(ds<=7, ds<=7? "First weekly review is due in "+(7-ds)+" day"+(7-ds===1?"":"s") : "First weekly review is due: say \"weekly review\""); }
  else row(d!==null && d<=7, d===null? "No weekly review recorded yet" : "Weekly review last run "+(d===0?"today":d+" day"+(d===1?"":"s")+" ago"));
  if(S.files["SETUP.md"]) row(false, "First-run setup is not finished yet");
  return out;
}

  var h='<div class="top"><div class="doc"><button class="btn sm menu" id="menuBtn">Menu</button><div class="crumb">'+esc(S.folderName)+" / "+esc(p)+'</div><div class="sub">Updated '+ago(rec.mtime)+'</div></div><div class="actions">'+themeSwitch()+

    }).join("")+'</div>';
  }).join("")+'</div>';

function renderSearch(q){
  var terms=q.toLowerCase(), hits=[];
  Object.keys(S.files).sort().forEach(function(p){
    var t=S.files[p].text, i=t.toLowerCase().indexOf(terms), inName=p.toLowerCase().indexOf(terms)>=0;
    if(i<0 && !inName) return;
    var snip=i>=0? t.slice(Math.max(0,i-60), i+q.length+90).replace(/\s+/g," ") : "";
    hits.push({p:p,snip:snip});
  });
  var re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig");
  var h=header("Search", hits.length+" file"+(hits.length===1?"":"s")+" mention \""+esc(q)+"\"");
  h+='<div class="card">'+(hits.length?hits.slice(0,80).map(function(x){
    return '<div class="hit"><a href="#" data-open="'+esc(x.p)+'">'+esc(x.p)+'</a>'+(x.snip?'<div class="m">'+esc(x.snip).replace(re,function(m){return "<mark>"+m+"</mark>";})+'</div>':'')+'</div>';
  }).join(""):'<div class="empty">No matches.</div>')+'</div>';
  S.view="search"; $("main").innerHTML=h;
}

function renderTrees(){
  if(!S.loadedAt){ $("wsTree").innerHTML='<div class="empty" style="padding:4px 9px">Open your folder to see them.</div>'; $("sysTree").innerHTML=""; return; }
  var M=model(), paths=Object.keys(S.files).sort();
  var ib=$("inboxBadge"); if(ib){ ib.textContent=M.inbox.length; ib.hidden=!M.inbox.length; }
  function tree(prefix, list){
    var dirs={}, files=[];
    list.forEach(function(p){ var rest=p.slice(prefix.length); var k=rest.indexOf("/"); if(k>0){ var d=rest.slice(0,k); (dirs[d]=dirs[d]||[]).push(p);} else files.push(p); });
    return Object.keys(dirs).sort().map(function(d){ return '<details><summary>'+esc(d)+'</summary><div class="kids">'+tree(prefix+d+"/",dirs[d])+'</div></details>'; }).join("")+
      files.map(function(p){ return '<button class="file'+(S.current===p?" on":"")+'" data-open="'+esc(p)+'">'+esc(p.slice(prefix.length))+'</button>'; }).join("");
  }
  var wsNames=Object.keys(M.ws).sort();
  $("wsTree").innerHTML=wsNames.length? wsNames.map(function(n,i){
    var list=paths.filter(function(p){ return p.indexOf(n+"/")===0; });
    return '<details'+(S.current&&S.current.indexOf(n+"/")===0?" open":"")+'><summary><span class="dot" style="background:'+COLORS[i%COLORS.length]+'"></span>'+esc(n)+'</summary><div class="kids">'+tree(n+"/",list)+'</div></details>';
  }).join("") : '<div class="empty" style="padding:4px 9px">None yet.</div>';
  var sys=paths.filter(function(p){ var top=p.split("/")[0]; return p.indexOf("/")<0 || !M.ws[top]; });
  var tempCount=M.temp.length;
  $("sysTree").innerHTML=tree("",sys).replace('<summary>98_Temp</summary>','<summary>98_Temp'+(tempCount?'<span class="badge">'+tempCount+'</span>':'')+'</summary>');
}


/* ---------- the working layer: board, inbox, workstation pages, Notion export ---------- */
var STATES={" ":"To do","/":"Started",">":"Waiting","x":"Done"};
var ORDER=[" ","/",">","x"];
function taskRef(t){ return t.path+"|"+t.line; }
function splitRef(ref){ var k=ref.lastIndexOf("|"); return { path:ref.slice(0,k), idx:parseInt(ref.slice(k+1),10) }; }
async function editLine(ref, fn, okMsg){
  var r=splitRef(ref), rec=S.files[r.path];
  if(!rec){ toast("That file is not loaded. Refresh and try again."); return false; }
  var lines=rec.text.split("\n"), line=lines[r.idx];
  if(line===undefined || !/^\s*-\s*\[[ \/>xX]\]/.test(line)){ toast("That task moved. Refresh and try again."); return false; }
  var nl=fn(line);
  if(nl===null) lines.splice(r.idx,1); else if(nl===line) return false; else lines[r.idx]=nl;
  return run(okMsg||"Updated.", async function(){ await writeFile(r.path, lines.join("\n"), rec.mtime); });
}
function setState(ref,ch){ return editLine(ref,function(l){ return l.replace(/\[[ \/>xX]\]/,"["+ch+"]"); }, ch==="x"?"Done. The weekly review clears finished tasks.":null); }
function setDue(ref,date){
  return editLine(ref,function(l){
    var any=/\s*\(due\s+\d{4}-\d{2}-\d{2}\)/i;
    if(!date) return l.replace(any,"");
    if(any.test(l)) return l.replace(/\(due\s+\d{4}-\d{2}-\d{2}\)/i,"(due "+date+")");
    return l.replace(/\s*$/," (due "+date+")");
  }, date?"Due date set to "+date+".":"Due date cleared.");
}
async function dropTask(ref){
  var r=splitRef(ref), rec=S.files[r.path], line=rec&&rec.text.split("\n")[r.idx]; if(!line) return;
  if(!confirm("Remove this task from "+r.path+"?\n\n"+line.replace(/^\s*-\s*\[.\]\s*/,""))) return;
  await editLine(ref,function(){ return null; },"Task removed.");
}
async function addTask(ws,text,due){
  text=text.trim().replace(/[\r\n]+/g," "); if(!text) throw new Error("Write the task first.");
  await appendEntry(ws+"/MEMORY.md","Next Actions","- [ ] "+text+(due?" (due "+due+")":""));
}
async function removeCapture(cap){
  var rec=S.files[cap.path]; if(!rec) throw new Error("CHANGED");
  var lines=rec.text.split("\n"); if(lines[cap.line]!==cap.raw) throw new Error("CHANGED");
  lines.splice(cap.line,1); await writeFile(cap.path, lines.join("\n"), rec.mtime);
}
function wsWithMemory(M){ return Object.keys(M.ws).filter(function(n){ return S.files[n+"/MEMORY.md"]; }).sort(); }
async function dropCapture(cap){
  if(!confirm("Remove this capture?\n\n"+cap.text)) return;
  await run("Capture removed.", function(){ return removeCapture(cap); });
}

function renderBoard(){
  var M=model(), f=S.boardWs||"", names=Object.keys(M.ws).filter(function(n){ return S.files[n+"/MEMORY.md"]; }).sort();
  var all=M.tasks.concat(M.doneTasks.slice(-15)).filter(function(t){ return !f || t.ws===f; });
  var h=header("Board","Every task from every workstation. "+(S.canWrite?"Drag a card to another column, or use the arrows. Changes save to your files.":"Read-only in this browser."));
  h+='<div class="chips"><select class="field" id="boardWs"><option value="">All workstations</option>'+names.map(function(n){ return '<option value="'+esc(n)+'"'+(n===f?" selected":"")+'>'+esc(n)+'</option>'; }).join("")+'</select><span class="m">Cards are sorted by due date. The Done column shows the 15 most recent.</span></div>';
  h+='<div class="board">'+ORDER.map(function(ch){
    var list=all.filter(function(t){ return t.st===ch; });

/* ---------- undo, creating files, and editing sections ---------- */
async function run(label, fn){
  S.txn=[];
  var ok=true;
  try{ await fn(); }catch(e){ ok=false; handleWriteError(e); }
  var t=S.txn; S.txn=null; render();
  if(ok) toast(label, t.length?{label:"Undo",fn:function(){ undoTxn(t); }}:null);
  return ok;
}
async function undoTxn(t){
  try{
    for(var i=t.length-1;i>=0;i--){
      var e=t[i];
      if(e.created){ try{ await e.parent.removeEntry(e.name); }catch(x){} delete S.files[e.path]; continue; }
      if(e.createdDir){ try{ await e.parent.removeEntry(e.name); }catch(x){} continue; }
      var rec=S.files[e.path]; if(!rec) continue;
      var cur=await rec.handle.getFile(), disk=await cur.text();
      if(disk!==e.after){ toast("Not undone: "+e.path+" has changed since."); return; }
      var w=await rec.handle.createWritable(); await w.write(e.before); await w.close();
      var f=await rec.handle.getFile(); rec.text=e.before; rec.mtime=f.lastModified;
    }
    render(); toast("Undone.");
  }catch(err){ handleWriteError(err); }
}
async function ensureDir(parts){
  var d=S.dir;
  for(var i=0;i<parts.length;i++){
    try{ d=await d.getDirectoryHandle(parts[i]); }
    catch(e){ var nd=await d.getDirectoryHandle(parts[i],{create:true}); if(S.txn) S.txn.push({createdDir:true,parent:d,name:parts[i]}); d=nd; }
  }
  return d;
}
async function createFile(path,text){
  if(!S.canWrite || !S.dir) throw new Error("This browser opened a read-only copy.");
  if(S.files[path]) throw new Error("EXISTS");
  var parts=path.split("/"), name=parts.pop(), d=await ensureDir(parts);
  var fh=await d.getFileHandle(name,{create:true}), w=await fh.createWritable(); await w.write(text); await w.close();
  var f=await fh.getFile(); S.files[path]={ text:text, mtime:f.lastModified, handle:fh };
  if(S.txn) S.txn.push({created:true,path:path,parent:d,name:name});
}
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function sectionBounds(lines,heading){
  var re=new RegExp("^##\\s+"+reEsc(heading)+"\\s*$","i"), h=lines.findIndex(function(l){ return re.test(l); });
  if(h<0) return null; var end=h+1; while(end<lines.length && !/^##\s/.test(lines[end])) end++; return {h:h,end:end};
}
function trimTail(lines,from,floor){ var at=from; while(at>floor && (!lines[at-1].trim() || /^---\s*$/.test(lines[at-1]))) at--; return at; }
function appendToSection(lines,heading,entry){
  var b=sectionBounds(lines,heading);
  if(!b){
    var ld=lines.findIndex(function(l){ return /^##\s+Linked Docs/i.test(l); });
    if(ld>=0){ var at=trimTail(lines,ld,0); lines.splice(at,ld-at,"","## "+heading,"",entry,"","---",""); }
    else { while(lines.length && !lines[lines.length-1].trim()) lines.pop(); lines.push("","## "+heading,"",entry,""); }
    return lines;
  }
  var none=-1; for(var i=b.h+1;i<b.end;i++) if(/^\((?:none yet|not planned yet)[^)]*\)\s*$/i.test(lines[i])) none=i;
  if(none>=0){ lines[none]=entry; return lines; }
  var ins=trimTail(lines,b.end,b.h+1); lines.splice(ins,0,entry); return lines;
}
async function appendEntry(path,heading,entry){
  var rec=S.files[path]; if(!rec) throw new Error(path+" is not in this workspace.");
  await writeFile(path, appendToSection(rec.text.split("\n"),heading,entry).join("\n"), rec.mtime);
}
function slug(s){ var x=String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,48); return x||"note"; }
function oneLine(s){ return String(s).replace(/[\r\n]+/g," ").replace(/\s+/g," ").trim(); }
function endDot(s){ s=oneLine(s); return /[.!?]$/.test(s)?s:s+"."; }
function mondayOf(iso){ var p=iso.split("-"), d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])), k=(d.getUTCDay()+6)%7; return isoAdd(iso,-k); }
function nextDow(iso,dow){ var p=iso.split("-"), d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])), add=(dow-d.getUTCDay()+7)%7; if(!add) add=7; return isoAdd(iso,add); }
function shortDay(d){ try{ var p=d.split("-"); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2],12)).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}); }catch(e){ return d; } }
function datePresets(none){
  var t=todayISO(), out=[{label:"Today",value:t},{label:"Tomorrow",value:isoAdd(t,1)}], fr=nextDow(t,5), mo=nextDow(t,1);
  if(fr>isoAdd(t,1)) out.push({label:shortDay(fr),value:fr});
  out.push({label:"Next Mon",value:mo});
  if(none) out.push({label:"No date",value:""});
  return out;
}

  if(t.dataset.done!==undefined){ markDone(parseInt(t.dataset.done,10)); return; }
  if(t.dataset.task){ toggleTask(t.dataset.task); return; }
  if(t.dataset.move){ S.moving=S.moving===t.dataset.move?null:t.dataset.move; render(); return; }
  if(t.dataset.moveto){ if(S.moving) moveItem(S.moving,t.dataset.moveto); return; }
  if(t.dataset.movecancel){ S.moving=null; render(); return; }
  if(t.id==="editBtn"){ S.editing=true; renderFile(); return; }
  if(t.id==="cancelEdit"){ S.editing=false; renderFile(); return; }
  if(t.id==="saveEdit"){ var p=S.current, rec=S.files[p]; writeFile(p,$("editor").value,rec.mtime).then(function(){ S.editing=false; toast("Saved "+p); render(); }).catch(handleWriteError); return; }
  if(t.id==="copyPath"){ var full=(S.folderName?S.folderName+"/":"")+S.current; (navigator.clipboard?navigator.clipboard.writeText(full):Promise.reject()).then(function(){toast("Copied "+full);},function(){toast(full);}); return; }
  if(t.dataset.name){ document.querySelectorAll("#nameOptions button").forEach(function(b){ b.classList.toggle("on", b===t); }); $("nameInput").value=""; return; }
  if(t.id==="nameSkip"){ store.set("cw-name-skipped","1"); $("nameDialog").close(); return; }
  if(t.id==="nameSave"){ var on=document.querySelector("#nameOptions button.on"); var n=$("nameInput").value.trim()||(on&&on.dataset.name)||""; if(!n){ toast("Pick a name or type one."); return; } $("nameDialog").close(); saveName(n); return; }
  if(t.id==="brandName"||t.id==="logo"){ if(S.loadedAt) openNameDialog(); }
});
document.addEventListener("dragstart",function(e){ var b=e.target.closest&&e.target.closest("[data-move]"); if(!b) return; e.dataTransfer.setData("text/plain",b.dataset.move); e.dataTransfer.effectAllowed="move"; });
document.addEventListener("dragstart",function(e){ var c=e.target.closest&&e.target.closest("[data-card]"); if(!c) return; e.dataTransfer.setData("text/plain","card|"+c.dataset.card); e.dataTransfer.effectAllowed="move"; c.classList.add("dragging"); });
document.addEventListener("dragend",function(e){ var c=e.target.closest&&e.target.closest("[data-card]"); if(c) c.classList.remove("dragging"); document.querySelectorAll(".col.over").forEach(function(x){ x.classList.remove("over"); }); });
document.addEventListener("dragover",function(e){ var c=e.target.closest&&e.target.closest("[data-col]"); if(!c) return; e.preventDefault(); document.querySelectorAll(".col.over").forEach(function(x){ if(x!==c) x.classList.remove("over"); }); c.classList.add("over"); });
document.addEventListener("drop",function(e){ var c=e.target.closest&&e.target.closest("[data-col]"); if(!c) return; e.preventDefault(); c.classList.remove("over"); var v=e.dataTransfer.getData("text/plain"); if(v.indexOf("card|")===0) setState(v.slice(5),c.dataset.col); });
document.addEventListener("change",function(e){ if(e.target.dataset && e.target.dataset.due!==undefined && e.target.dataset.due){ setDue(e.target.dataset.due,e.target.value); return; } if(e.target.id==="boardWs"){ S.boardWs=e.target.value; render(); } });
document.addEventListener("dragover",function(e){ var d=e.target.closest&&e.target.closest("[data-day]"); if(!d) return; e.preventDefault(); document.querySelectorAll(".day.over").forEach(function(x){ if(x!==d) x.classList.remove("over"); }); d.classList.add("over"); });
document.addEventListener("dragleave",function(e){ var d=e.target.closest&&e.target.closest("[data-day]"); if(d && !d.contains(e.relatedTarget)) d.classList.remove("over"); });
document.addEventListener("drop",function(e){ var d=e.target.closest&&e.target.closest("[data-day]"); if(!d) return; e.preventDefault(); d.classList.remove("over"); var ref=e.dataTransfer.getData("text/plain"); if(ref) moveItem(ref,d.dataset.day); });
$("logo").title="Rename this dashboard"; $("brandName").style.cursor="pointer"; $("logo").style.cursor="pointer";
$("brandName").addEventListener("click",function(){ if(S.loadedAt) openNameDialog(); });
$("logo").addEventListener("click",function(){ if(S.loadedAt) openNameDialog(); });
document.addEventListener("submit",function(ev){ if(ev.target.id==="captureForm"){ ev.preventDefault(); var v=$("captureInput").value; capture(v); } });
var searchTimer; $("search").addEventListener("input",function(e){ var q=e.target.value.trim(); clearTimeout(searchTimer); searchTimer=setTimeout(function(){ if(!S.loadedAt) return; if(q.length<2){ if(S.view==="search") setView("dashboard"); return; } renderSearch(q); },150); });
document.addEventListener("keydown",function(e){ if(e.key==="/" && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="TEXTAREA"){ e.preventDefault(); $("search").focus(); } });

document.addEventListener("keydown",function(e){
  var k=e.key;
  if((e.metaKey||e.ctrlKey) && !e.altKey && !e.shiftKey && String(k).toLowerCase()==="k"){ e.preventDefault(); if(PAL.open) closePalette(); else if(S.loadedAt) openPalette(); return; }
  if(PAL.open){
    if(k==="Escape"){ e.preventDefault(); closePalette(); }
    else if(k==="ArrowDown"){ e.preventDefault(); PAL.sel=Math.min(PAL.items.length-1,PAL.sel+1); palRender(); }
    else if(k==="ArrowUp"){ e.preventDefault(); PAL.sel=Math.max(0,PAL.sel-1); palRender(); }
    else if(k==="Enter"){ e.preventDefault(); runPal(PAL.sel); }
    return;
  }
  if($("formDialog").open){
    if(k==="Enter" && e.target.tagName==="TEXTAREA"){ if(e.metaKey||e.ctrlKey){ e.preventDefault(); submitForm(); } }
    else if(k==="Enter" && e.target.tagName!=="BUTTON"){ e.preventDefault(); submitForm(); }
    return;
  }
  if(!S.loadedAt || e.metaKey || e.ctrlKey || e.altKey || S.editing || $("nameDialog").open) return;
  var ae=document.activeElement, tag=ae&&ae.tagName; if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(ae&&ae.isContentEditable)) return;
  var a=ACTIONS.filter(function(x){ return x.key===k; })[0]; if(a && S.canWrite){ e.preventDefault(); openAction(a.id); }
});
$("palInput").addEventListener("input",function(e){ PAL.items=palItems(e.target.value.trim()); PAL.sel=0; palRender(); });
$("palList").addEventListener("click",function(e){ var it=e.target.closest(".pit"); if(it) runPal(parseInt(it.dataset.pi,10)); });
$("palList").addEventListener("mousemove",function(e){ var it=e.target.closest(".pit"); if(it){ var i=parseInt(it.dataset.pi,10); if(i!==PAL.sel){ PAL.sel=i; var on=$("palList").querySelector(".pit.on"); if(on) on.classList.remove("on"); it.classList.add("on"); } } });
$("pal").addEventListener("mousedown",function(e){ if(e.target===$("pal")) closePalette(); });
$("kbdHint").textContent=kbdLabel();

/* hidden folder input for browsers without the folder picker */
var input=document.createElement("input"); input.type="file"; input.id="folderInput"; input.multiple=true; input.setAttribute("webkitdirectory",""); input.style.display="none";
input.addEventListener("change",function(){ if(input.files.length) loadFromInput(input.files); });
document.body.appendChild(input);

function afterLoad(){
  S.view="dashboard"; S.current=null; S.editing=false;
  var M=model(); if(!M.dashName){ var local=store.get("cw-name"); if(local) S.localName=local; }
  render();
  if(!M.dashName && !store.get("cw-name") && !store.get("cw-name-skipped")) setTimeout(openNameDialog,300);
}
/* a name kept only in this browser fills in when MEMORY.md has none */
var _model=model; model=function(){ var m=_model(); if(!m.dashName && store.get("cw-name")) m.dashName=store.get("cw-name"); return m; };

/* hook for automated checks: load files without a folder picker */
window.CoworkDashboard={ openAction:function(id,o){ return openAction(id,o); }, model:function(){ return model(); }, loadFiles:function(map,opts){ S.files={}; Object.keys(map).forEach(function(k){ var v=map[k]; S.files[k]= typeof v==="string"? {text:v,mtime:Date.now(),handle:null} : v; }); S.folderName=(opts&&opts.name)||"workspace"; S.canWrite=!!(opts&&opts.canWrite); S.dir=(opts&&opts.dir)||null; S.loadedAt=Date.now(); afterLoad(); }, state:S };

render();
})();
</script>
