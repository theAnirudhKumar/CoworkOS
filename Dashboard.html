<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace Dashboard</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#ffffff;--side:#fbfaf8;--ink:#1d1f23;--muted:#6b6f76;--line:#e6e3dd;
  --accent:#3b5bdb;--accent-ink:#ffffff;--soft:#eef2ff;--warn:#b45309;--warnsoft:#fff3e0;--ok:#2f855a;--oksoft:#e8f5ee;
  --chip:#f1efea;--code:#f3f1ec;--shadow:0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111317;--panel:#181b21;--side:#14161b;--ink:#e8eaee;--muted:#9aa1ad;--line:#2a2f38;
    --accent:#7c93f2;--accent-ink:#0f1115;--soft:#1f2640;--warn:#f0a35e;--warnsoft:#33261a;--ok:#5fc48c;--oksoft:#16301f;
    --chip:#22262e;--code:#1f232a;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#111317;--panel:#181b21;--side:#14161b;--ink:#e8eaee;--muted:#9aa1ad;--line:#2a2f38;
  --accent:#7c93f2;--accent-ink:#0f1115;--soft:#1f2640;--warn:#f0a35e;--warnsoft:#33261a;--ok:#5fc48c;--oksoft:#16301f;
  --chip:#22262e;--code:#1f232a;--shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:270px 1fr;height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;margin:2px 4px 14px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);margin-bottom:12px;font:inherit}
.nav button{display:flex;width:100%;gap:9px;align-items:center;padding:7px 9px;border:0;background:none;border-radius:7px;text-align:left}
.nav button:hover{background:var(--chip)}
.nav button.on{background:var(--soft);color:var(--accent);font-weight:600}
.sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 9px 6px}
.tree{font-size:13.5px}
.tree details{margin:0}
.tree summary{list-style:none;padding:4px 8px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree summary::-webkit-details-marker{display:none}
.tree summary:hover,.tree .file:hover{background:var(--chip)}
.tree .file{display:block;width:100%;text-align:left;border:0;background:none;padding:3px 8px;border-radius:6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree .file.on{color:var(--accent);background:var(--soft)}
.tree .kids{padding-left:14px}
.dot{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}
.badge{font-size:11px;padding:0 6px;border-radius:99px;background:var(--warnsoft);color:var(--warn);margin-left:auto}
main{overflow:auto;padding:24px 32px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:24px;margin:0 0 4px;line-height:1.25}
.sub{color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:550}
.btn:hover{border-color:var(--muted)}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12.5px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 10px;font-size:12.5px}
.seg button.on{background:var(--soft);color:var(--accent);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:700}
.stat .n small{font-size:14px;color:var(--muted);font-weight:500}
.stat .l{color:var(--muted);font-size:13px}
.bar{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.over i{background:var(--warn)}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
h2{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
h2 span{color:var(--muted);font-weight:500}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .body{flex:1;min-width:0}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.w{background:var(--warnsoft);color:var(--warn)}
.tag.g{background:var(--oksoft);color:var(--ok)}
.t{font-weight:560}
.m{color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.weekcard{margin-bottom:14px}
.focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.focus .f{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--side)}
.focus .f .t{font-weight:600}
.focus .f .m{margin-top:4px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:96px}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .dh{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.day.today .dh{color:var(--accent)}
.blk{font-size:12px;border-radius:6px;padding:4px 6px;margin-bottom:4px;background:var(--soft);color:var(--ink);border-left:3px solid var(--accent);overflow-wrap:anywhere}
.blk .tm{display:block;color:var(--muted);font-size:11px}
.blk.due{background:var(--warnsoft);border-left-color:var(--warn)}
.blk.fixed{background:var(--chip);border-left-color:var(--muted)}
button.blk{display:block;width:100%;text-align:left;font:inherit;font-size:12px;border:0;border-left:3px solid var(--accent);cursor:grab}
button.blk.due{border-left-color:var(--warn)}
button.blk.sel{outline:2px solid var(--accent)}
.day.over{background:var(--soft)}
.movemenu{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.movemenu .btn{padding:2px 7px;font-size:11px}
.goal{padding:8px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .t{font-weight:600;display:flex;gap:8px;justify-content:space-between;align-items:baseline}
.goal .m{margin-top:3px}
.ws{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.wsc{border:1px solid var(--line);border-radius:10px;padding:11px;background:none;text-align:left}
.wsc:hover{border-color:var(--muted)}
.wsc .nm{font-weight:600;display:flex;align-items:center;gap:7px}
.doc{max-width:860px}
.doc .crumb{color:var(--muted);font-size:12.5px;margin-bottom:6px;word-break:break-all}
.md h1{font-size:24px;margin:.2em 0 .5em}.md h2{font-size:18px;margin:1.4em 0 .5em;display:block}.md h3{font-size:15px;margin:1.2em 0 .4em}
.md p{margin:.6em 0}.md ul,.md ol{padding-left:22px}.md li{margin:.25em 0}
.md code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.92em}
.md pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto}.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:13.5px}
.md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.md th{background:var(--chip)}
.md blockquote{margin:.8em 0;padding:4px 14px;border-left:3px solid var(--line);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
textarea.editor{width:100%;min-height:65vh;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px;resize:vertical}
.hit{padding:10px 0;border-top:1px solid var(--line)}.hit:first-child{border-top:0}
.hit mark{background:var(--soft);color:var(--ink);padding:0 2px;border-radius:3px}
.welcome{max-width:620px;margin:8vh auto;text-align:left}
.welcome h1{font-size:28px}
.welcome ol{padding-left:20px}.welcome li{margin:6px 0}
.note{background:var(--warnsoft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:22px;max-width:460px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.names{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.names button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px}
.names button.on{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.field{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.menu{display:none}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--side);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:150px}
.col.over{background:var(--soft);border-color:var(--accent)}
.col h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;box-shadow:var(--shadow);cursor:grab}
.tcard.dragging{opacity:.5}
.tcard .tt{font-weight:560;overflow-wrap:anywhere}
.tcard .tools{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap;align-items:center}
.tcard input[type=date]{font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.chips select,.chips .field{width:auto}
.dl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.dl:first-of-type{border-top:0}
dialog label{display:block;margin:10px 0 4px;color:var(--muted);font-size:12.5px}
@media (max-width:860px){
  .board{grid-template-columns:1fr}
  .app{grid-template-columns:1fr}
  aside{display:none;position:fixed;inset:0 25% 0 0;z-index:5;box-shadow:0 0 40px rgba(0,0,0,.3)}
  aside.open{display:block}
  .menu{display:inline-block}
  main{padding:16px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:1fr}
  .days{grid-template-columns:1fr}
  .day{min-height:0}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><div class="logo" id="logo">W</div><span id="brandName">My Workspace</span></div>
    <input class="search" id="search" type="search" placeholder="Search all files" autocomplete="off">
    <div class="nav">
      <button data-view="dashboard" class="on">Dashboard</button>
      <button data-view="board">Board</button>
      <button data-view="inbox">Inbox<span class="badge" id="inboxBadge" hidden></span></button>
      <button data-view="projects">Projects</button>
      <button data-view="goals">Goals</button>
      <button data-view="files">All files</button>
      <button data-open="MEMORY.md">Memory</button>
      <button data-view="notion">Notion</button>
    </div>
    <div class="sec">Workstations</div>
    <div class="tree" id="wsTree"></div>
    <div class="sec">Workspace</div>
    <div class="tree" id="sysTree"></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="nameDialog">
  <h2 style="display:block;font-size:17px">Name your dashboard</h2>
  <div class="sub">Pick one of these, or write your own. You can change it later.</div>
  <div class="names" id="nameOptions"></div>
  <input class="field" id="nameInput" placeholder="Or type a name" maxlength="40">
  <div class="sub" id="nameWhere" style="margin-top:10px;font-size:12.5px"></div>
  <div class="actions" style="justify-content:flex-end;margin-top:16px">
    <button class="btn" id="nameSkip">Not now</button>
    <button class="btn p" id="nameSave">Save name</button>
  </div>
</dialog>
<dialog id="taskDialog">
  <h2 style="display:block;font-size:17px" id="taskDlgTitle">New task</h2>
  <label for="taskText">Task</label>
  <input class="field" id="taskText" maxlength="200" autocomplete="off" placeholder="What needs doing?">
  <label for="taskWs">Workstation</label>
  <select class="field" id="taskWs"></select>
  <label for="taskDue">Due date (optional)</label>
  <input class="field" type="date" id="taskDue">
  <div class="actions" style="justify-content:flex-end;margin-top:16px">
    <button class="btn" id="taskCancel">Cancel</button>
    <button class="btn p" id="taskSave">Add task</button>
  </div>
</dialog>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";

/* ---------- small helpers ---------- */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("show");},2600); }
var TZ=null; /* the user's time zone from Core Memory, when one is recorded */
function tzOpt(o){ o=o||{}; if(TZ) o.timeZone=TZ; return o; }
function todayISO(){ try{ return new Intl.DateTimeFormat("en-CA",tzOpt({year:"numeric",month:"2-digit",day:"2-digit"})).format(new Date()); }catch(e){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); } }
function daysSince(iso){ if(!iso) return null; var t=Date.parse(iso+"T00:00:00"); if(isNaN(t)) return null; return Math.max(0,Math.floor((Date.parse(todayISO()+"T00:00:00")-t)/86400000)); }
function ago(ms){ if(!ms) return ""; var d=Math.max(0,Math.floor((Date.now()-ms)/86400000)); if(d<=0) return "today"; if(d===1) return "yesterday"; if(d<7) return d+" days ago"; if(d<14) return "last week"; if(d<60) return Math.floor(d/7)+" weeks ago"; return Math.floor(d/30)+" months ago"; }
var COLORS=["#3b5bdb","#2f855a","#c2410c","#9333ea","#0891b2","#a16207","#be185d","#4d7c0f","#0f766e","#7c3aed"];
var store={ get:function(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set:function(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };

/* ---------- theme: light, dark or system ---------- */
function applyTheme(mode){
  if(mode==="light"||mode==="dark") document.documentElement.setAttribute("data-theme",mode);
  else document.documentElement.removeAttribute("data-theme");
  store.set("cw-theme",mode);
  document.querySelectorAll("[data-theme-btn]").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-theme-btn")===mode); });
}
var themeMode = store.get("cw-theme") || "system";
applyTheme(themeMode);
function themeSwitch(){
  return '<div class="seg" title="Theme">'+["light","dark","system"].map(function(m){
    return '<button data-theme-btn="'+m+'" class="'+(themeMode===m?"on":"")+'">'+m.charAt(0).toUpperCase()+m.slice(1)+'</button>';
  }).join("")+'</div>';
}

/* ---------- state ---------- */
var S = { dir:null, files:{}, canWrite:false, view:"welcome", current:null, editing:false, folderName:"", loadedAt:0 };
var SKIP_DIRS = { ".git":1, "node_modules":1, ".backups":1, ".obsidian":1, ".claude":1, ".github":1, ".trash":1 };

/* ---------- loading the folder ---------- */
async function walk(dirHandle, prefix, out){
  for await (var entry of dirHandle.values()){
    var path = prefix ? prefix+"/"+entry.name : entry.name;
    if(entry.kind==="directory"){
      if(SKIP_DIRS[entry.name] || entry.name.charAt(0)===".") continue;
      await walk(entry, path, out);
    } else if(/\.md$/i.test(entry.name)){
      var f = await entry.getFile();
      out[path] = { text: await f.text(), mtime: f.lastModified, handle: entry };
    }
  }
}
async function openWithPicker(){
  if(!window.showDirectoryPicker){ $("folderInput").click(); return; }
  try{
    var dir = await window.showDirectoryPicker({ id:"cowork-workspace", mode:"readwrite" });
    await loadDir(dir);
    saveHandle(dir);
  }catch(e){ if(e && e.name!=="AbortError") toast("Could not open that folder: "+e.message); }
}
async function loadDir(dir){
  var out={}; await walk(dir,"",out);
  S.dir=dir; S.files=out; S.folderName=dir.name; S.loadedAt=Date.now();
  S.canWrite = true;
  try{ if(dir.queryPermission && (await dir.queryPermission({mode:"readwrite"}))!=="granted") S.canWrite=false; }catch(e){}
  afterLoad();
}
function loadFromInput(fileList){
  var out={}, pending=[];
  Array.prototype.forEach.call(fileList,function(f){
    var rel=(f.webkitRelativePath||f.name).split("/");
    var top=rel.shift();
    S.folderName=top;
    var path=rel.join("/");
    if(!/\.md$/i.test(path)) return;
    if(rel.some(function(p){ return SKIP_DIRS[p] || p.charAt(0)==="."; })) return;
    pending.push(f.text().then(function(t){ out[path]={ text:t, mtime:f.lastModified, handle:null }; }));
  });
  Promise.all(pending).then(function(){ S.dir=null; S.files=out; S.canWrite=false; S.loadedAt=Date.now(); afterLoad(); });
}
/* remember the folder between visits, where the browser allows it */
function idb(){ return new Promise(function(res,rej){ var r=indexedDB.open("cowork-dashboard",1); r.onupgradeneeded=function(){ r.result.createObjectStore("h"); }; r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }
async function saveHandle(h){ try{ var db=await idb(); db.transaction("h","readwrite").objectStore("h").put(h,"dir"); }catch(e){} }
async function getHandle(){ try{ var db=await idb(); return await new Promise(function(res){ var q=db.transaction("h").objectStore("h").get("dir"); q.onsuccess=function(){res(q.result||null);}; q.onerror=function(){res(null);}; }); }catch(e){ return null; } }
async function reopen(h){
  try{
    var p = await h.requestPermission({mode:"readwrite"});
    if(p!=="granted"){ toast("Permission was not given."); return; }
    await loadDir(h);
  }catch(e){ toast("Could not reopen the folder. Choose it again."); }
}
async function refresh(){
  if(S.dir){ await loadDir(S.dir); toast("Read the folder again."); }
  else { toast("Choose the folder again to see changes."); $("folderInput").click(); }
}

/* ---------- writing files ---------- */
async function writeFile(path, text, expectMtime){
  var rec=S.files[path];
  if(!S.canWrite || !rec || !rec.handle) throw new Error("This browser opened a read-only copy.");
  var cur=await rec.handle.getFile();
  if(expectMtime && cur.lastModified!==expectMtime){
    var disk=await cur.text();
    if(disk!==rec.text) throw new Error("CHANGED");
  }
  var w=await rec.handle.createWritable(); await w.write(text); await w.close();
  var f=await rec.handle.getFile(); rec.text=text; rec.mtime=f.lastModified;
}

/* ---------- reading the workspace ---------- */
function sections(text){
  var out={}, cur=null;
  (text||"").split("\n").forEach(function(line,i){
    var m=line.match(/^##\s+(.+?)\s*$/);
    if(m){ cur=m[1].trim(); out[cur]={start:i,lines:[]}; return; }
    if(cur) out[cur].lines.push({text:line,index:i});
  });
  return out;
}
function entriesOf(sec){
  if(!sec) return [];
  return sec.lines.filter(function(l){ return /^\s*-\s+/.test(l.text) && !/Example entry:/i.test(l.text); }).map(function(l){
    var raw=l.text.replace(/^\s*-\s+/,"");
    var dm=raw.match(/^\[(\d{4}-\d{2}-\d{2})\]\s*/); var date=dm?dm[1]:null; if(dm) raw=raw.slice(dm[0].length);
    var plain=raw.replace(/\*\*|__|`/g,"").replace(/\[(\d{4}-\d{2}-\d{2})\]/g,"$1").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1");
    var title=plain, detail="";
    var q=plain.match(/^"([^"]+)"\s*[-:]?\s*(.*)$/);
    if(q){ title=q[1]; detail=q[2]; }

/* ---------- markdown to HTML (small, safe subset) ---------- */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(m,t,u){
    if(/^https?:\/\//i.test(u)) return '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>';
    return '<a href="#" data-link="'+u+'">'+t+'</a>';
  });
  return s;
}
function md(text){
  var lines=text.replace(/\r/g,"").split("\n"), out=[], i=0;
  if(lines[0]==="---"){ var e=lines.indexOf("---",1); if(e>0) i=e+1; }
  var list=null;
  function close(){ if(list){ out.push("</"+list+">"); list=null; } }
  while(i<lines.length){
    var l=lines[i];
    if(/^```/.test(l)){ close(); var buf=[]; i++; while(i<lines.length && !/^```/.test(lines[i])){ buf.push(esc(lines[i])); i++; } out.push("<pre><code>"+buf.join("\n")+"</code></pre>"); i++; continue; }
    if(/^\|/.test(l) && i+1<lines.length && /^\|\s*:?-/.test(lines[i+1])){
      close(); var head=l.split("|").slice(1,-1); var html="<table><thead><tr>"+head.map(function(c){return "<th>"+inline(c.trim())+"</th>";}).join("")+"</tr></thead><tbody>"; i+=2;
      while(i<lines.length && /^\|/.test(lines[i])){ html+="<tr>"+lines[i].split("|").slice(1,-1).map(function(c){return "<td>"+inline(c.trim())+"</td>";}).join("")+"</tr>"; i++; }
      out.push(html+"</tbody></table>"); continue;
    }
    var h=l.match(/^(#{1,4})\s+(.*)$/); if(h){ close(); out.push("<h"+h[1].length+">"+inline(h[2])+"</h"+h[1].length+">"); i++; continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){ close(); out.push("<hr>"); i++; continue; }
    if(/^>\s?/.test(l)){ close(); out.push("<blockquote>"+inline(l.replace(/^>\s?/,""))+"</blockquote>"); i++; continue; }
    var ul=l.match(/^\s*[-*]\s+(.*)$/), ol=l.match(/^\s*\d+\.\s+(.*)$/);
    if(ul||ol){ var kind=ul?"ul":"ol"; if(list!==kind){ close(); out.push("<"+kind+">"); list=kind; } out.push("<li>"+inline((ul||ol)[1])+"</li>"); i++; continue; }
    if(!l.trim()){ close(); i++; continue; }
    close(); var para=[l]; i++;
    while(i<lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\||>|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])){ para.push(lines[i]); i++; }
    out.push("<p>"+inline(para.join(" "))+"</p>");
  }
  close();
  return out.join("\n");
}

var STATES={" ":"To do","/":"Started",">":"Waiting","x":"Done"};
var ORDER=[" ","/",">","x"];
function taskRef(t){ return t.path+"|"+t.line; }
function splitRef(ref){ var k=ref.lastIndexOf("|"); return { path:ref.slice(0,k), idx:parseInt(ref.slice(k+1),10) }; }
async function editLine(ref, fn, okMsg){
  var r=splitRef(ref), rec=S.files[r.path];
  if(!rec){ toast("That file is not loaded. Refresh and try again."); return false; }
  var lines=rec.text.split("\n"), line=lines[r.idx];
  if(line===undefined || !/^\s*-\s*\[[ \/>xX]\]/.test(line)){ toast("That task moved. Refresh and try again."); return false; }
  var nl=fn(line);
  if(nl===null) lines.splice(r.idx,1); else if(nl===line) return false; else lines[r.idx]=nl;
  try{ await writeFile(r.path, lines.join("\n"), rec.mtime); if(okMsg) toast(okMsg); render(); return true; }
  catch(e){ handleWriteError(e); return false; }
}
function setState(ref,ch){ return editLine(ref,function(l){ return l.replace(/\[[ \/>xX]\]/,"["+ch+"]"); }, ch==="x"?"Done. The weekly review clears finished tasks.":null); }
function setDue(ref,date){
  return editLine(ref,function(l){
    var any=/\s*\(due\s+\d{4}-\d{2}-\d{2}\)/i;
    if(!date) return l.replace(any,"");
    if(any.test(l)) return l.replace(/\(due\s+\d{4}-\d{2}-\d{2}\)/i,"(due "+date+")");
    return l.replace(/\s*$/," (due "+date+")");
  }, date?"Due date set to "+date+".":"Due date cleared.");
}
async function dropTask(ref){
  var r=splitRef(ref), rec=S.files[r.path], line=rec&&rec.text.split("\n")[r.idx]; if(!line) return;
  if(!confirm("Remove this task from "+r.path+"?\n\n"+line.replace(/^\s*-\s*\[.\]\s*/,""))) return;
  await editLine(ref,function(){ return null; },"Task removed.");
}
async function addTask(ws,text,due){
  text=text.trim().replace(/[\r\n]+/g," "); if(!text) throw new Error("Write the task first.");
  var path=ws+"/MEMORY.md", rec=S.files[path]; if(!rec) throw new Error(ws+" has no MEMORY.md yet.");
  var entry="- [ ] "+text+(due?" (due "+due+")":"");
  var lines=rec.text.split("\n"), h=lines.findIndex(function(l){ return /^##\s+Next Actions\s*$/.test(l); });
  if(h<0){
    var ld=lines.findIndex(function(l){ return /^##\s+Linked Docs/i.test(l); });
    if(ld>=0){ var at=ld; while(at>0 && (!lines[at-1].trim() || /^---\s*$/.test(lines[at-1]))) at--; lines.splice(at,ld-at,"","## Next Actions","",entry,"","---",""); }
    else { while(lines.length && !lines[lines.length-1].trim()) lines.pop(); lines.push("","## Next Actions","",entry,""); }
  }
  else {
    var end=h+1; while(end<lines.length && !/^##\s/.test(lines[end])) end++;
    var noneAt=-1; for(var i=h+1;i<end;i++) if(/^\(none yet\)\s*$/.test(lines[i])) noneAt=i;
    if(noneAt>=0) lines[noneAt]=entry;
    else { var ins=end; while(ins>h+1 && (!lines[ins-1].trim() || /^---\s*$/.test(lines[ins-1]))) ins--; lines.splice(ins,0,entry); }
  }
  await writeFile(path, lines.join("\n"), rec.mtime);
}
async function removeCapture(cap){
  var rec=S.files[cap.path]; if(!rec) throw new Error("CHANGED");
  var lines=rec.text.split("\n"); if(lines[cap.line]!==cap.raw) throw new Error("CHANGED");
  lines.splice(cap.line,1); await writeFile(cap.path, lines.join("\n"), rec.mtime);
}

  h+='<div class="card"><h2>Projects <span>that mention '+esc(n)+'</span></h2>'+(related.length?related.map(function(e){ return '<div class="row"><div class="body"><div class="t">'+esc(e.title)+'</div>'+(e.detail?'<div class="m">'+esc(e.detail)+'</div>':'')+'</div></div>'; }).join(""):'<div class="empty">None recorded.</div>')+'</div>';
  h+='<div class="card" style="grid-column:1/-1"><h2>Files <span>'+w.files.length+'</span></h2>'+w.files.slice().sort(function(a,b){ return (S.files[b].mtime||0)-(S.files[a].mtime||0); }).slice(0,40).map(function(p){
    return '<div class="row"><div class="body"><a href="#" data-open="'+esc(p)+'">'+esc(p.slice(n.length+1))+'</a></div><span class="m">'+ago(S.files[p].mtime)+'</span></div>';
  }).join("")+'</div>';
  h+='</div>';
  $("main").innerHTML=h;
}

/* ---------- Notion: CSV files that import as databases ---------- */
function csv(rows){ return rows.map(function(r){ return r.map(function(c){ c=c==null?"":String(c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(","); }).join("\n")+"\n"; }
function download(name,text){
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}
function notionTables(M){
  var tk=M.tasks.concat(M.doneTasks);
  return [
    { name:"Tasks", rows:[["Name","Status","Due","Workstation"]].concat(tk.map(function(t){ return [t.text,STATES[t.st],t.due||"",t.ws]; })) },
    { name:"Projects", rows:[["Name","Notes","Last active"]].concat(M.projects.map(function(e){ return [e.title,e.detail,e.date||""]; })) },
    { name:"Goals", rows:[["Goal","Target date","Quarter milestone","Milestone date","If-then plan","Workstation"]].concat(M.goals.map(function(g){ return [g.text,g.by||"",g.quarter||"",g.qby||"",g.plan||"",g.ws||""]; })) },
    { name:"Inbox", rows:[["Capture","Captured","Source"]].concat(M.inbox.map(function(x){ return [x.text,x.date||"",x.phone?"Phone":"Inbox"]; })) },
    { name:"Workstations", rows:[["Name","Files"]].concat(Object.keys(M.ws).sort().map(function(n){ return [n,M.ws[n].files.length]; })) }
  ];
}
function renderNotion(){
  var M=model(), T=notionTables(M);
  var h=header("Notion","The same second brain as Notion databases, for when you want to work in Notion.");
  h+='<div class="grid"><div class="card"><h2>Export for Notion <span>CSV files</span></h2><div class="m" style="margin-bottom:6px">Each file imports as one Notion database, with column names that match the Command Center layout in your guide.</div>'+T.map(function(t){
    return '<div class="dl"><div><div class="t">'+t.name+'</div><div class="m">'+(t.rows.length-1)+' row'+(t.rows.length===2?"":"s")+' &middot; '+esc(t.rows[0].join(", "))+'</div></div><button class="btn sm" data-csv="'+t.name+'">Download</button></div>';
  }).join("")+'</div><div class="card"><h2>How to bring them in</h2><ol style="padding-left:20px;margin:0"><li>In Notion, open the page that will hold your Command Center.</li><li>Type <code>/import</code>, choose <strong>CSV</strong>, and pick one downloaded file. Repeat for each.</li><li>Set the <strong>Status</strong> column of Tasks to a Select or Status property if Notion reads it as text.</li><li>To keep the two in step afterwards, say "sync with Notion" to your AI. Your markdown files stay the source of truth.</li></ol>'+(S.files["00_Resources/Notion Command Center Guide.md"]?'<div style="margin-top:12px"><button class="btn" data-open="00_Resources/Notion Command Center Guide.md">Open the full guide</button></div>':'')+'</div></div>';
  $("main").innerHTML=h;
}

function render(){
  var M=S.loadedAt?model():null, name=(M&&M.dashName)||"My Workspace";
  $("brandName").textContent=name; $("logo").textContent=name.trim().charAt(0).toUpperCase()||"W";
  document.title=name+(S.loadedAt?"":" Dashboard");
  renderTrees();
  if(!S.loadedAt) renderWelcome();
  else if(S.view==="file") renderFile();
  else if(S.view==="files") renderFiles();
  else if(S.view==="board") renderBoard();
  else if(S.view==="inbox") renderInbox();
  else if(S.view==="projects") renderProjects();
  else if(S.view==="goals") renderGoals();
  else if(S.view==="ws") renderWs();
  else if(S.view==="notion") renderNotion();
  else renderDashboard();
}

/* ---------- actions ---------- */
async function markDone(lineIndex){
  var rec=S.files["MEMORY.md"]; if(!rec) return;
  var lines=rec.text.split("\n"), line=lines[lineIndex];
  if(!line || !/^\s*-\s+/.test(line)) { toast("That item moved. Refresh and try again."); return; }
  if(!confirm("Mark this as done and remove it from Open Items in MEMORY.md?\n\n"+line.replace(/^\s*-\s+/,""))) return;
  lines.splice(lineIndex,1);
  try{ await writeFile("MEMORY.md", lines.join("\n"), rec.mtime); toast("Done. Removed from Open Items."); render(); }
  catch(e){ handleWriteError(e); }
}
async function toggleTask(ref){
  var k=ref.lastIndexOf("|"), path=ref.slice(0,k), idx=parseInt(ref.slice(k+1),10), rec=S.files[path];
  if(!rec) return;
  var lines=rec.text.split("\n"), line=lines[idx];
  if(!line || !/^\s*-\s*\[[ \/>]\]/.test(line)){ toast("That task moved. Refresh and try again."); return; }
  lines[idx]=line.replace(/\[[ \/>]\]/,"[x]");
  try{ await writeFile(path, lines.join("\n"), rec.mtime); toast("Done. The weekly review clears finished tasks."); render(); }
  catch(e){ handleWriteError(e); }
}
async function capture(text){
  text=text.trim().replace(/[\r\n]+/g," "); if(!text) return;
  var path="98_Temp/Inbox.md", rec=S.files[path], entry="- ["+todayISO()+"] "+text;
  try{
    if(!rec){
      if(!S.canWrite || !S.dir) throw new Error("This browser opened a read-only copy.");
      var folder=await S.dir.getDirectoryHandle("98_Temp",{create:true});
      var fh=await folder.getFileHandle("Inbox.md",{create:true});
      var body="# Inbox\n\nQuick captures, one dated line each, newest at the bottom.\n\n"+entry+"\n";
      var w=await fh.createWritable(); await w.write(body); await w.close();
      var f=await fh.getFile(); S.files[path]={text:body,mtime:f.lastModified,handle:fh};
    } else {
      var t=rec.text.replace(/\s*$/,"")+"\n"+entry+"\n";
      await writeFile(path, t, rec.mtime);
    }
    toast("Captured to your inbox."); render();
  }catch(e){ handleWriteError(e); }
}
function handleWriteError(e){
  if(e && e.message==="CHANGED") toast("This file changed on disk since it was read. Refresh, then try again. Nothing was overwritten.");
  else toast("Could not save: "+(e&&e.message||e));
}

var NAME_IDEAS=["Atlas","Basecamp","Compass","Mission Control","North Star","Headquarters","The Desk"];
function openNameDialog(){
  var M=model(), ideas=NAME_IDEAS.slice(); if(M.userName) ideas.push(M.userName+"'s HQ");
  var picked=M.dashName||"";
  $("nameOptions").innerHTML=ideas.map(function(n){ return '<button data-name="'+esc(n)+'" class="'+(n===picked?"on":"")+'">'+esc(n)+'</button>'; }).join("");
  $("nameInput").value=ideas.indexOf(picked)<0?picked:"";
  $("nameWhere").textContent=S.canWrite? "Saved as one line in the Core Memory section of MEMORY.md, so your AI tool knows it too." : "This browser cannot save to your folder, so the name is kept in this browser only. Ask your AI tool to add \"Dashboard name: ...\" to Core Memory to keep it everywhere.";
  $("nameDialog").showModal();
}
async function saveName(name){
  name=name.trim().replace(/[\r\n]/g," ").slice(0,40); if(!name) return;
  var rec=S.files["MEMORY.md"];
  if(S.canWrite && rec){
    var lines=rec.text.split("\n"), entry="- ["+todayISO()+"] Dashboard name: "+name+".";
    var at=lines.findIndex(function(l){ return /Dashboard name:/i.test(l); });
    if(at>=0) lines[at]=entry;
    else {
      var h=lines.findIndex(function(l){ return /^##\s+Core Memory\s*$/.test(l); });
      if(h<0){ lines.push("","## Core Memory","",entry); }
      else {
        var end=h+1; while(end<lines.length && !/^##\s/.test(lines[end])) end++;
        var body=lines.slice(h+1,end); var noneAt=body.findIndex(function(l){ return /^\(none yet\)\s*$/.test(l); });
        if(noneAt>=0) lines[h+1+noneAt]=entry;
        else { var ins=end; while(ins>h+1 && !lines[ins-1].trim()) ins--; lines.splice(ins,0,entry); }
      }
    }
    try{ await writeFile("MEMORY.md", lines.join("\n"), rec.mtime); toast("Saved. Your dashboard is now "+name+"."); }
    catch(e){ handleWriteError(e); return; }
  } else { store.set("cw-name",name); toast("Saved in this browser."); }
  render();
}

/* ---------- events ---------- */
document.addEventListener("click", function(ev){
  var t=ev.target.closest("button, a"); if(!t) return;
  if(t.dataset.themeBtn){ themeMode=t.dataset.themeBtn; applyTheme(themeMode); return; }
  if(t.dataset.newtask){ ev.preventDefault(); openTaskDialog({ws:t.dataset.newtask==="1"?null:t.dataset.newtask}); return; }
  if(t.dataset.ws){ S.wsName=t.dataset.ws; setView("ws"); return; }
  if(t.dataset.to!==undefined && t.dataset.ref){ setState(t.dataset.ref,t.dataset.to); return; }
  if(t.dataset.tdrop){ dropTask(t.dataset.tdrop); return; }
  if(t.dataset.captotask!==undefined){ var cp=model().inbox[parseInt(t.dataset.captotask,10)]; if(cp) openTaskDialog({text:cp.text,cap:cp}); return; }
  if(t.dataset.capdrop!==undefined){ var cd=model().inbox[parseInt(t.dataset.capdrop,10)]; if(cd) dropCapture(cd); return; }
  if(t.dataset.csv){ var tb=notionTables(model()).filter(function(x){ return x.name===t.dataset.csv; })[0]; if(tb){ download(tb.name+".csv",csv(tb.rows)); toast("Downloaded "+tb.name+".csv"); } return; }
  if(t.id==="taskCancel"){ $("taskDialog").close(); return; }
  if(t.id==="taskSave"){ saveTaskDialog(); return; }
  if(t.id==="openBtn"){ openWithPicker(); return; }
  if(t.id==="refreshBtn"){ refresh(); return; }
  if(t.id==="menuBtn"){ $("side").classList.toggle("open"); return; }
  if(t.dataset.view){ ev.preventDefault(); if(!S.loadedAt){ renderWelcome(); return; } setView(t.dataset.view); return; }
  if(t.dataset.open){ ev.preventDefault(); if(!S.loadedAt) return; setView("file", t.dataset.open); return; }
  if(t.dataset.link){ ev.preventDefault(); var base=S.current&&S.current.indexOf("/")>0?S.current.slice(0,S.current.lastIndexOf("/")+1):""; var target=decodeURIComponent(t.dataset.link.split("#")[0]);
    var cand=[base+target, target].map(function(x){ return x.replace(/^\.\//,""); }); for(var i=0;i<cand.length;i++){ if(S.files[cand[i]]){ setView("file",cand[i]); return; } } toast("That file is not in this folder."); return; }
  if(t.dataset.done!==undefined){ markDone(parseInt(t.dataset.done,10)); return; }
  if(t.dataset.task){ toggleTask(t.dataset.task); return; }
  if(t.dataset.move){ S.moving=S.moving===t.dataset.move?null:t.dataset.move; render(); return; }
  if(t.dataset.moveto){ if(S.moving) moveItem(S.moving,t.dataset.moveto); return; }
  if(t.dataset.movecancel){ S.moving=null; render(); return; }
  if(t.id==="editBtn"){ S.editing=true; renderFile(); return; }
  if(t.id==="cancelEdit"){ S.editing=false; renderFile(); return; }
  if(t.id==="saveEdit"){ var p=S.current, rec=S.files[p]; writeFile(p,$("editor").value,rec.mtime).then(function(){ S.editing=false; toast("Saved "+p); render(); }).catch(handleWriteError); return; }
  if(t.id==="copyPath"){ var full=(S.folderName?S.folderName+"/":"")+S.current; (navigator.clipboard?navigator.clipboard.writeText(full):Promise.reject()).then(function(){toast("Copied "+full);},function(){toast(full);}); return; }
  if(t.dataset.name){ document.querySelectorAll("#nameOptions button").forEach(function(b){ b.classList.toggle("on", b===t); }); $("nameInput").value=""; return; }
  if(t.id==="nameSkip"){ store.set("cw-name-skipped","1"); $("nameDialog").close(); return; }
  if(t.id==="nameSave"){ var on=document.querySelector("#nameOptions button.on"); var n=$("nameInput").value.trim()||(on&&on.dataset.name)||""; if(!n){ toast("Pick a name or type one."); return; } $("nameDialog").close(); saveName(n); return; }
  if(t.id==="brandName"||t.id==="logo"){ if(S.loadedAt) openNameDialog(); }
});
document.addEventListener("dragstart",function(e){ var b=e.target.closest&&e.target.closest("[data-move]"); if(!b) return; e.dataTransfer.setData("text/plain",b.dataset.move); e.dataTransfer.effectAllowed="move"; });
document.addEventListener("dragstart",function(e){ var c=e.target.closest&&e.target.closest("[data-card]"); if(!c) return; e.dataTransfer.setData("text/plain","card|"+c.dataset.card); e.dataTransfer.effectAllowed="move"; c.classList.add("dragging"); });
document.addEventListener("dragend",function(e){ var c=e.target.closest&&e.target.closest("[data-card]"); if(c) c.classList.remove("dragging"); document.querySelectorAll(".col.over").forEach(function(x){ x.classList.remove("over"); }); });
document.addEventListener("dragover",function(e){ var c=e.target.closest&&e.target.closest("[data-col]"); if(!c) return; e.preventDefault(); document.querySelectorAll(".col.over").forEach(function(x){ if(x!==c) x.classList.remove("over"); }); c.classList.add("over"); });
document.addEventListener("drop",function(e){ var c=e.target.closest&&e.target.closest("[data-col]"); if(!c) return; e.preventDefault(); c.classList.remove("over"); var v=e.dataTransfer.getData("text/plain"); if(v.indexOf("card|")===0) setState(v.slice(5),c.dataset.col); });
document.addEventListener("change",function(e){ if(e.target.dataset && e.target.dataset.due!==undefined && e.target.dataset.due){ setDue(e.target.dataset.due,e.target.value); return; } if(e.target.id==="boardWs"){ S.boardWs=e.target.value; render(); } });
document.addEventListener("dragover",function(e){ var d=e.target.closest&&e.target.closest("[data-day]"); if(!d) return; e.preventDefault(); document.querySelectorAll(".day.over").forEach(function(x){ if(x!==d) x.classList.remove("over"); }); d.classList.add("over"); });
document.addEventListener("dragleave",function(e){ var d=e.target.closest&&e.target.closest("[data-day]"); if(d && !d.contains(e.relatedTarget)) d.classList.remove("over"); });
document.addEventListener("drop",function(e){ var d=e.target.closest&&e.target.closest("[data-day]"); if(!d) return; e.preventDefault(); d.classList.remove("over"); var ref=e.dataTransfer.getData("text/plain"); if(ref) moveItem(ref,d.dataset.day); });
$("logo").title="Rename this dashboard"; $("brandName").style.cursor="pointer"; $("logo").style.cursor="pointer";
$("brandName").addEventListener("click",function(){ if(S.loadedAt) openNameDialog(); });
$("logo").addEventListener("click",function(){ if(S.loadedAt) openNameDialog(); });
document.addEventListener("submit",function(ev){ if(ev.target.id==="captureForm"){ ev.preventDefault(); var v=$("captureInput").value; capture(v); } });
var searchTimer; $("search").addEventListener("input",function(e){ var q=e.target.value.trim(); clearTimeout(searchTimer); searchTimer=setTimeout(function(){ if(!S.loadedAt) return; if(q.length<2){ if(S.view==="search") setView("dashboard"); return; } renderSearch(q); },150); });
document.addEventListener("keydown",function(e){ if(e.key==="/" && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="TEXTAREA"){ e.preventDefault(); $("search").focus(); } });

/* hidden folder input for browsers without the folder picker */
var input=document.createElement("input"); input.type="file"; input.id="folderInput"; input.multiple=true; input.setAttribute("webkitdirectory",""); input.style.display="none";
input.addEventListener("change",function(){ if(input.files.length) loadFromInput(input.files); });
document.body.appendChild(input);

function afterLoad(){
  S.view="dashboard"; S.current=null; S.editing=false;
  var M=model(); if(!M.dashName){ var local=store.get("cw-name"); if(local) S.localName=local; }
  render();
  if(!M.dashName && !store.get("cw-name") && !store.get("cw-name-skipped")) setTimeout(openNameDialog,300);
}
/* a name kept only in this browser fills in when MEMORY.md has none */
var _model=model; model=function(){ var m=_model(); if(!m.dashName && store.get("cw-name")) m.dashName=store.get("cw-name"); return m; };

/* hook for automated checks: load files without a folder picker */
window.CoworkDashboard={ loadFiles:function(map,opts){ S.files={}; Object.keys(map).forEach(function(k){ var v=map[k]; S.files[k]= typeof v==="string"? {text:v,mtime:Date.now(),handle:null} : v; }); S.folderName=(opts&&opts.name)||"workspace"; S.canWrite=!!(opts&&opts.canWrite); S.dir=null; S.loadedAt=Date.now(); afterLoad(); }, state:S };

render();
})();
</script>
